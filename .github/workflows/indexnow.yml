# Tells search engines (Bing, Yandex and the others that use "IndexNow") which pages the site
# has, every time its pages change. Google does not use IndexNow: for Google see docs/GET-FOUND.md.
# How it works: IndexNow accepts a list of addresses from whoever can prove that the site is theirs.
# The proof is the small text file 2bcef68462ffeea45658b64de94970d4.txt next to index.html: it holds the same
# key that this job sends. The key is not a secret (anyone can read that file).
# The job never fails: if the service does not answer, it only says so in its log.
name: Tell search engines about the pages

on:
  push:
    branches: [main]
    paths: ["sitemap.xml", "**.html"]
  workflow_dispatch:         # and by hand, from the Actions tab

permissions:
  contents: read

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub Pages needs about a minute to publish the new pages (and the key file).
      # A run started by hand does not wait: the site is already published then.
      - name: Wait until the site is published
        if: github.event_name == 'push'
        run: sleep 180

      - name: Send the list of pages (sitemap.xml)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, re, urllib.error, urllib.request

          SITE = "https://newfter.github.io/AI-Compass/"
          KEY = "2bcef68462ffeea45658b64de94970d4"
          AGENT = "Mozilla/5.0 (compatible; AI-Compass-pages/1.0; +" + SITE + ")"

          def ask(address, data=None, agent=AGENT):
              headers = {}
              if agent:
                  headers["User-Agent"] = agent
              if data is not None:
                  headers["Content-Type"] = "application/json; charset=utf-8"
              request = urllib.request.Request(address, data=data, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as answer:
                      return answer.status, answer.read(500).decode("utf-8", "replace").strip()
              except urllib.error.HTTPError as error:
                  return error.code, error.read(500).decode("utf-8", "replace").strip()
              except Exception as error:
                  return 0, str(error)

          def body(pages):
              return json.dumps({"host": "newfter.github.io", "key": KEY, "keyLocation": SITE + KEY + ".txt", "urlList": pages}).encode("utf-8")

          print("0. robots.txt of the host:", ask("https://newfter.github.io/robots.txt")[0], "| sitemap.xml of the site:", ask(SITE + "sitemap.xml")[0])
          status, text = ask(SITE + KEY + ".txt")
          print("1. Key file on the site:", status, repr(text[:80]), "right" if (status == 200 and text == KEY) else "NOT RIGHT")

          pages = sorted(set(re.findall(r"<loc>([^<]+)</loc>", open("sitemap.xml", encoding="utf-8").read())))
          pages = [page for page in pages if page.startswith(SITE)]
          one = [SITE + "lessons/"]

          print("2. One address, the program does not say its name:", ask("https://api.indexnow.org/indexnow", body(one), agent=None))
          print("3. One address, the program says its name:", ask("https://api.indexnow.org/indexnow", body(one)))
          for service in ["https://api.indexnow.org/indexnow", "https://www.bing.com/indexnow", "https://yandex.com/indexnow"]:
              print("4. All", len(pages), "addresses to", service, "->", ask(service, body(pages)))
          PY
