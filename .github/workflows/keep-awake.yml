# Keeps the free Supabase project awake: Supabase pauses a free project that nobody has used
# for 7 days, so this job calls the database's tiny "ping" function once a day. It reads the
# project address and the public key from js/config.js (nothing secret is involved). While
# js/config.js is empty (accounts switched off), the job does nothing.
name: Keep the database awake

on:
  schedule:
    - cron: "17 6 * * *"     # every day at 06:17 UTC
  workflow_dispatch:         # and by hand, from the Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Call the database's ping function
        run: |
          url=$(grep -oE 'supabaseUrl:\s*"[^"]*"' js/config.js | sed -E 's/.*"([^"]*)"/\1/')
          key=$(grep -oE 'supabaseAnonKey:\s*"[^"]*"' js/config.js | sed -E 's/.*"([^"]*)"/\1/')
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "js/config.js is empty: accounts are switched off, nothing to do."
            exit 0
          fi
          status=$(curl -sS -o /tmp/ping.txt -w "%{http_code}" -X POST "$url/rest/v1/rpc/ping" \
            -H "apikey: $key" -H "Authorization: Bearer $key" -H "Content-Type: application/json" -d '{}')
          echo "ping answered $status: $(cat /tmp/ping.txt)"
          [ "$status" = "200" ]
